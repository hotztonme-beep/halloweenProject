<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightmare — Halloween</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;700;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: #08040d;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
}

body:before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 50% 20%, rgba(255, 94, 0, .12), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(123, 0, 255, .1), transparent 30%);
    z-index: -2;
}

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    background: linear-gradient(to bottom, rgba(5, 2, 9, .9), transparent);
}

.logo {
    font-family: 'Creepster', cursive;
    font-size: 2rem;
    color: #ff641f;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(255, 78, 0, .7);
}

nav a {
    color: #ddd;
    text-decoration: none;
    margin-left: 28px;
    font-size: .85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: .3s;
}

nav a:hover {
    color: #ff641f;
    text-shadow: 0 0 12px #ff641f;
}

.hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 100px 20px;
    overflow: hidden;
    background:
        linear-gradient(rgba(8, 4, 13, .35), rgba(8, 4, 13, .95)),
        radial-gradient(circle at 50% 75%, #3d1600 0%, #130a17 35%, #08040d 70%);
}

.moon {
    position: absolute;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    background: #ffb14e;
    box-shadow: 0 0 80px rgba(255, 120, 25, .3);
    top: 13%;
    right: 14%;
    opacity: .9;
}

.moon:after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        radial-gradient(circle at 25% 35%, rgba(100,40,0,.18) 0 7px, transparent 8px),
        radial-gradient(circle at 60% 25%, rgba(100,40,0,.15) 0 13px, transparent 14px),
        radial-gradient(circle at 70% 65%, rgba(100,40,0,.13) 0 20px, transparent 21px);
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#ffb56b 1px, transparent 1px);
    background-size: 110px 110px, 170px 170px;
    opacity: .35;
}

.hero-content {
    position: relative;
    z-index: 3;
    max-width: 900px;
}

.eyebrow {
    color: #ff6b25;
    font-size: .8rem;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 18px;
}

h1 {
    font-family: 'Creepster', cursive;
    font-size: clamp(5rem, 15vw, 11rem);
    line-height: .8;
    color: #ff641f;
    text-shadow:
        0 4px 0 #7d2508,
        0 0 30px rgba(255, 80, 0, .45);
    transform: rotate(-2deg);
}

.subtitle {
    margin: 35px auto;
    max-width: 600px;
    color: #c9c3cd;
    line-height: 1.7;
    font-size: 1rem;
}

.btn {
    display: inline-block;
    padding: 16px 30px;
    border-radius: 5px;
    color: #08040d;
    background: #ff641f;
    text-decoration: none;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(255, 88, 20, .3);
    transition: .3s;
}

.btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(255, 88, 20, .45);
}

.bats {
    position: absolute;
    font-size: 2rem;
    opacity: .4;
    animation: fly 8s infinite ease-in-out;
}

.bat1 { top: 25%; left: 15%; }
.bat2 { top: 38%; left: 8%; animation-delay: 2s; font-size: 1.3rem; }
.bat3 { top: 18%; right: 40%; animation-delay: 4s; }

@keyframes fly {
    0%,100% { transform: translate(0,0) rotate(-8deg); }
    50% { transform: translate(35px,-20px) rotate(8deg); }
}

section {
    padding: 110px 7%;
}

.section-title {
    text-align: center;
    margin-bottom: 55px;
}

.section-title span {
    color: #ff641f;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: .75rem;
    font-weight: 900;
}

.section-title h2 {
    font-family: 'Creepster', cursive;
    font-size: 4rem;
    margin-top: 8px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    max-width: 1100px;
    margin: auto;
}

.card {
    position: relative;
    min-height: 270px;
    padding: 35px;
    border: 1px solid rgba(255, 100, 31, .18);
    background: linear-gradient(145deg, rgba(30, 15, 35, .8), rgba(12, 7, 18, .9));
    border-radius: 12px;
    overflow: hidden;
    transition: .35s;
}

.card:hover {
    transform: translateY(-10px);
    border-color: rgba(255, 100, 31, .65);
    box-shadow: 0 20px 60px rgba(255, 70, 0, .12);
}

.card:before {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    background: #ff641f;
    filter: blur(80px);
    opacity: .08;
    right: -50px;
    top: -50px;
}

.icon {
    font-size: 3rem;
    margin-bottom: 25px;
}

.card h3 {
    font-size: 1.3rem;
    margin-bottom: 12px;
}

.card p {
    color: #8f8996;
    line-height: 1.7;
    font-size: .9rem;
}

.cta {
    margin: 40px 7% 100px;
    padding: 75px 30px;
    text-align: center;
    border-radius: 18px;
    background:
        linear-gradient(rgba(20, 7, 25, .7), rgba(20, 7, 25, .95)),
        radial-gradient(circle at center, #702000, transparent 65%);
    border: 1px solid rgba(255, 100, 31, .2);
}

.cta h2 {
    font-family: 'Creepster', cursive;
    color: #ff641f;
    font-size: clamp(3rem, 7vw, 6rem);
    margin-bottom: 15px;
}

.cta p {
    color: #aaa;
    margin-bottom: 30px;
}

footer {
    padding: 30px 7%;
    border-top: 1px solid #1b1320;
    text-align: center;
    color: #55505b;
    font-size: .75rem;
    letter-spacing: 2px;
}

@media (max-width: 750px) {
    nav a {
        display: none;
    }

    .moon {
        width: 190px;
        height: 190px;
        right: -20px;
        top: 15%;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    section {
        padding: 80px 6%;
    }

    .section-title h2 {
        font-size: 3.3rem;
    }
}
</style>
</head>
<body>

<nav>
    <div class="logo">NIGHTMARE</div>
    <div>
        <a href="#haunts">Haunts</a>
        <a href="#ritual">Ritual</a>
    </div>
</nav>

<main>
    <section class="hero">
        <div class="stars"></div>
        <div class="moon"></div>
        <div class="bats bat1">🦇</div>
        <div class="bats bat2">🦇</div>
        <div class="bats bat3">🦇</div>

        <div class="hero-content">
            <div class="eyebrow">The night has arrived</div>
            <h1>HALLOWEEN</h1>
            <p class="subtitle">
                Step into the darkness. Where ghosts wander, pumpkins glow,
                and every shadow has a story waiting to be told.
            </p>
            <a href="#haunts" class="btn">Enter If You Dare</a>
        </div>
    </section>

   
</body>
</html>
